[package]
name = "pictkura"
description = "最小機能×爆速の画像管理アプリ"
version.workspace = true
edition.workspace = true
license.workspace = true
# crates.io へ上げるものではない（OSSライセンス一覧からも自分自身が外れる）
publish = false

[lib]
name = "pictkura_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pictkura-core = { path = "../crates/pictkura-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# OS既定アプリで開く／エクスプローラーで場所を表示する（クロスプラットフォーム）
tauri-plugin-opener = "2"
# USB挿入の自動起動（AutoPlay）で2重起動されたとき、新しい窓を開かず
# 動作中のインスタンスへドライブパスを渡す
tauri-plugin-single-instance = "2"
# 削除はゴミ箱へ入れる（完全削除にしない）
trash = "5"
sysinfo = { version = "0.33", default-features = false, features = ["disk"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 設定画面のプレビュー（今日の日付でフォルダ例を作る）用
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 新しい版が出ていないかを見に行くだけのHTTP（0.2）。**アプリの唯一の外向き通信**で、
# 起動時に1回、GitHubのReleases APIを叩く（設定で切れる）。reqwestではなくこれを選ぶのは、
# 非同期ランタイムを持ち込まず `spawn_blocking` の中でそのまま書けるため。
# プロキシは環境変数（HTTP(S)_PROXY）だけを見る——Windowsのシステムプロキシ設定は読まない
ureq = "3"

# 空の理由を答える確認に、**有限時間の待ち**（`time`）と、ルートごとの探りに
# 相乗りするための受け口（`sync` の `watch`）が要る。刺さったマウントでは
# 探りが返らないので、待つ側は時間で切り上げて「応答がない」と言う。版は Tauri が引いているものと同じなので
# **新しいクレートは増えない**が、Tauri は `time` を有効にしていないので
# （実測: `cargo tree -e features`）、この行のぶん一度だけビルドし直される。
# **`time` はここで初めて付く**——`async_runtime` の `enable_all()` は
# `enable_time()` を feature で守っているので、これが無いと
# `tokio::time::timeout` は「no reactor running」で落ちる
tokio = { version = "1", default-features = false, features = ["time", "sync"] }
# 抽出（Issue #13）でクリップボードへ**画像として**載せる。
#
# フロントで済ませる道は無い。`media://` を fetch するのは CSP の
# `connect-src`（`tauri.conf.json`）が塞いでいるし、表示中の `<img>` を canvas
# へ描いても、`media://` にCORSヘッダが無いので**canvasが汚れて `toBlob` が
# 落ちる**。CSPを広げてまでフロントに寄せる理由が無い——Rust側には既に
# 同じバイト列がある。
#
# 既定の機能は切ってある: `image` は arboard と `image` クレートの相互変換で、
# こちらは `ImageData` を直に組むので要らない。**`wayland-data-control` は
# 足してある**——切ると Linux は X11 だけになり、Wayland のセッションでは
# 押しても黙って何も起きない。Windows/macOS のビルドには入らない
# （arboard 側でターゲット別に分かれている）。
arboard = { version = "3.6", default-features = false, features = [
    "image-data",
    "windows-sys",
    "core-graphics",
    "wayland-data-control",
] }

# ドライブ種別（リムーバブル/固定/ネットワーク/光学）の判定に GetDriveTypeW を使う。
# sysinfo は removable かどうかしか教えてくれず、ネットワークドライブを
# 「取り込み元」として自動走査してしまうため
[target.'cfg(windows)'.dependencies]
# Win32_System_Registry: AutoPlayハンドラをHKCUへ登録する（autoplay.rs）
windows-sys = { version = "0.60", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_Foundation",
] }

# マウントの旗（`MNT_DONTBROWSE`）を読むための `statfs`。sysinfo は旗を返さない。
# Tauri が既に同じ版を引いているので、依存は増えても新しくビルドされない
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# 実物のフォルダとシンボリックリンクを作るテストで使う
# （綴りを揃える方と、空の理由を答える方の両方）
[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
