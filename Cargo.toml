[workspace]
resolver = "2"
members = ["crates/pictkura-core", "src-tauri"]

[workspace.package]
version = "0.2.3"
edition = "2021"
license = "MIT"

# rav1d 1.1.0 の crates.io 版は ARM64 でビルドできない。あちらの `Cargo.toml` の
# `exclude` に `*.h` が入っているためパッケージに `src/arm/asm-offsets.h` が含まれず、
# ARM64のasm（`refmvs.S` / `filmgrain.S` / `filmgrain16.S`）が `#include` に失敗する。
# **同じ版（タグ v1.1.0）を git から取る**ことで回避する。中身は上流のタグそのもの。
#
# `[patch.crates-io]` は**ターゲット別に書けない**ので、これは Windows の配布物にも
# 効く（供給元が crates.io → git に変わる。版は同じ）。macOSを配ると決めた
# 2026-08-14に、それを承知で入れた。asm を落とす道はAVIFデコードが6倍遅くなるので取らない。
# **上流の `exclude` が直った版が出たら、ここは消してcrates.ioへ戻すこと。**
[patch.crates-io]
rav1d = { git = "https://github.com/memorysafety/rav1d", tag = "v1.1.0" }

# **パニックの出口を塞いだままにする**（`dev/loadmap.md` 1.3）。
#
# 一度 `unwrap()` を撤去しても、次に書く1行でまた戻る。ここで拒否にしておけば、
# 書いた本人がその場で気付く——壊れたファイル1枚でアプリが落ちるのは、
# 数万枚のライブラリでは「いつか」ではなく「必ず」起きる。
#
# 逃がしたいときは、その行に `#[allow(...)]` と**理由**を書く。黙って通す道は残さない。
# テストの中は素通し（`clippy.toml`）——落ちること自体が結果なので。
#
# `indexing_slicing`（添字の外れ）は**入れていない**。本体だけで130か所あり、
# 一つずつ `get()` に直すと読めなくなる場所が多い。代わりに
# `crates/pictkura-core/tests/malformed_files.rs` で**壊れたファイルを実際に食わせて**
# 落ちないことを確かめている。網（`panics::catching`）はその外側にある。
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
