# 配布物を作る。
#
#   Windows … MSI ja-JP / en-US ＋ 持ち歩き版ZIP
#   macOS   … pictkura.app を収めたZIP（Apple Silicon 専用・未署名）
#
# **手元のスクリプト（`tools/release.ps1` / `tools/release-macos.sh`）を
# そのまま呼ぶ**のが要点。CIに手順を書き写すと二重管理になり、
# 「手元では出るのにCIでは出ない」が静かに生まれる。
# UIのビルドを先に走らせる理由もあのスクリプトのコメントに書いてある。
#
# 動かし方は2通り:
#   - `v0.1.0` のようなタグを push  … Releases に**下書き**として配布物が付く
#     （公開は人が押す: `gh release edit vX.Y.Z --draft=false`。理由は `publish` に）
#   - 手動実行（workflow_dispatch）  … 成果物だけ作って中身を確かめる
#
# **公開は別ジョブ（`publish`）に切り出してある。** 各ビルドジョブが自分で
# `gh release create` すると、2つが同時に同じReleaseを作りにいって競り合ううえ、
# 片方が落ちたときに**片OSだけのリリースが出来てしまう**。両方揃ってから1回だけ載せる。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 同じタグを2回押しても、同じReleaseを2つのジョブが触りにいかないようにする。
# **途中で止めない**（配布物を作りかけで捨てない）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 既定は読めれば足りる。書き込みは `publish` だけが自分で引き上げる
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 既定では書き込み権のあるトークンが .git/config に平文で残る。
          # このジョブは依存のbuild.rsとnpmのスクリプトを走らせるので置かない
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # **22.18 以上**（2026-09-02）。辞書のテスト（下の検査に入っている）は
          # Node が `.ts` をそのまま読めることに乗っていて、それが既定になったのが 22.18。
          # `ui/package.json` の `engines` と同じ床
          node-version: "^22.18"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # rav1d（AVIF）と mozjpeg のアセンブリに要る。**外すと6倍遅くなる**。
      # 版を固定するのは、これが**配布バイナリの中身に直接効く入力**だから
      - name: NASM を入れる
        # **`shell` を明示する。** Windowsランナーの既定は pwsh だが、
        # 書いていないと actionlint が bash と思って shellcheck を掛ける
        # （PowerShellの `$n` や `{}` が構文誤りとして並ぶ）。
        # 何より、既定に頼らないほうが読む側に優しい
        shell: pwsh
        run: |
          # **瞬断だけ拾う。障害は待たない。** 2026-08-31 に Chocolatey の
          # API（`/api/v2/`）が 503 を返し、サイト本体は 200 のまま、という
          # 部分障害でPRが2回止まった。**あの回はこの3回では救えない**
          # （20分以上続いた）——ここが見ているのは、数十秒で戻る類のほうである。
          #
          # **失敗は握り潰さない。** 3回とも駄目なら `exit 1` で step ごと落とす。
          # NASMを欠いたまま先へ進むと、後ろのビルドが**別の顔で**転ぶか、もっと
          # 悪くてアセンブリを落としたバイナリが黙って出来る（上の「6倍遅くなる」）。
          #
          # 下の1行は保険である。**既定は偽なので、今日は書かなくても動く**
          # （PowerShell 7.6 の about_Preference_Variables で確認）。それでも
          # 書くのは、**この繰り返しの正しさをそこに預けているから**——真に
          # なると、GitHubのpwshが設定する `$ErrorActionPreference = 'Stop'` と
          # 噛み合って**`choco` の非0終了がその場で例外になり**、1回目の失敗で
          # step が死ぬ。繰り返す前に終わってしまう。
          #
          # `throw` ではなく `exit 1` を使うのも同じ筋で、こちらはシェルの
          # 設定に依らず必ず落ちる。
          #
          # `choco install` は既に入っているとき 0 を返すので、途中まで入った
          # 状態から試し直しても壊れない
          $PSNativeCommandUseErrorActionPreference = $false
          $tries = 3
          $ok = $false
          foreach ($n in 1..$tries) {
            choco install nasm -y --no-progress --version=3.2.0
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            if ($n -lt $tries) {
              Write-Host "::warning::choco が exit $LASTEXITCODE で落ちました（$n/$tries）。60秒待って試し直します"
              Start-Sleep -Seconds 60
            }
          }
          if (-not $ok) {
            Write-Host "::error::NASM を入れられませんでした（$tries 回とも失敗）。Chocolatey 側の障害が続いているなら、復旧を確かめてから再実行してください"
            exit 1
          }
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@v2

      # MSIを作るのに要る。`--features cli` は不要（plan.md の引き継ぎ節）。
      # ~/.cargo/bin は上のキャッシュに乗るが、**キャッシュはrefごと**なので
      # タグからの実行では基本コールドになる（mainでの手動実行が温めた場合だけ効く）
      # **版を固定する。** `tools/release.ps1` は「語が見つからなければ bundler は
      # 警告して束ねる」という上流の枝に乗っている（3つの入れ物に同じバイト列を
      # 入れるため）。**その枝は上流の実装であって、約束された仕様ではない**ので、
      # 浮かせておくと**ある日黙って3本のバイト列に戻る**。下の「中身が1本か」で
      # 気づけるようにはしてあるが、**まず動かないようにする。**
      - name: tauri-cli
        run: |
          $want = "2.11.4"
          $have = ""
          # **版を訊くだけで落ちないようにする。** GitHub Actions の pwsh は
          # `$ErrorActionPreference = 'stop'` で走るので、**キャッシュから戻した
          # `cargo-tauri` が起動できない**（別のツールチェインで作られた・DLL が無い・
          # 復元が中途半端）と、**直すための `cargo install --force` へ辿り着く前に
          # ステップごと落ちる**。版が読めなければ「未導入」として入れ直す。
          if (Get-Command cargo-tauri -ErrorAction SilentlyContinue) {
            try {
              # **`2>&1` にしない。** `stop` の下では、native command が
              # **stderr に1行書いただけで `NativeCommandError` が飛ぶ**——
              # cargo の警告1本で catch に落ち、**版が合っているのに数分かけて入れ直す。**
              $out = (cargo tauri --version 2>$null) -join " "
              if ($out -match '(\d+\.\d+\.\d+)') { $have = $Matches[1] }
            } catch { $have = "" }
          }
          if ($have -ne $want) {
            "tauri-cli: $(if ($have) { $have } else { '未導入' }) -> $want"
            cargo install tauri-cli --version $want --locked --force
          } else {
            "tauri-cli: $have（そのまま）"
          }

      - name: npm の依存
        run: npm --prefix ui ci

      # **タグ push では ci.yml が1行も走らない**（`branches:` フィルタは tag ref に
      # マッチしない）。ここで検査しないと、CIが赤のコミットへタグを打つだけで
      # 未検査の配布物がReleasesに載る。UIのビルドは release.ps1 が改めて行うが、
      # `tauri::generate_context!` の展開に `ui/dist` が要るのでテストの前に置く。
      # clippy は書式・作法の門なので main 側（ci.yml）に任せ、ここでは正しさだけ見る。
      # **辞書のテストもここに要る**（2026-09-02、ゲート2・3巡目）——ci.yml にだけ置くと、
      # 配布物そのものは1度も辞書を見られずに出ていく
      - name: 検査（タグはci.ymlを迂回するため）
        run: |
          npm --prefix ui run build
          npm --prefix ui test
          cargo fmt --all --check
          cargo test --workspace --locked

      # **置き場を1回だけ決めて、以降はここを見る。**
      # `CARGO_TARGET_DIR` が置かれると `target\release` の決め打ちは外れる。
      # **測る段と、数える段と、上げる段が別々の場所を指すのが一番まずい**
      # ——**測った物と配る物が違っていても気づけない。**
      - name: 置き場を決める
        run: |
          # **`--locked` を付ける。** `cargo metadata` は解決をやり直して
          # **`Cargo.lock` を黙って書き換える**——ここで書き換わると、
          # このあと作る配布物が**手元の木と違う依存**で出来る。
          $meta = cargo metadata --format-version 1 --no-deps --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata が $LASTEXITCODE で落ちた" }
          $targetDir = ($meta | ConvertFrom-Json).target_directory
          if (-not $targetDir) { throw "cargo metadata から置き場を取れない" }
          # **区切りは / に寄せる。** upload-artifact の glob は / を期待するので、
          # \ のまま渡すと**一致しないのに if-no-files-found: error まで進む**。
          # PowerShell 側は / でも読めるので、揃えても困らない。
          $releaseDir = (Join-Path $targetDir "release").Replace("\", "/")
          $bundleDir = "$releaseDir/bundle"
          "PK_RELEASE_DIR=$releaseDir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PK_BUNDLE_DIR=$bundleDir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "  置き場: $bundleDir"

      # WiX は tauri-cli が必要になった時点で自分で取ってくる
      - name: 配布物を作る
        run: pwsh tools/release.ps1

      # **数えて確かめる**。`if-no-files-found: error` は検索結果が「全部空」の
      # ときしか発火しないので、MSIだけ出てZIPが出ない・言語が1つ欠けた、を素通しする。
      # ZIPの中身も見るのは、アプリが実行ファイルの隣から取説とライセンス一覧を
      # 探すため——並びが崩れると「同梱されていません」になる（pack-portable.ps1）
      - name: 配布物が揃っているか
        run: |
          $msi = @(Get-ChildItem "$env:PK_BUNDLE_DIR/msi/*.msi" -ErrorAction SilentlyContinue)
          $nsis = @(Get-ChildItem "$env:PK_BUNDLE_DIR/nsis/*-setup.exe" -ErrorAction SilentlyContinue)
          $zip = @(Get-ChildItem "$env:PK_BUNDLE_DIR/portable/*.zip" -ErrorAction SilentlyContinue)
          if ($msi.Count -ne 2) { throw "MSIが2つ（ja-JP / en-US）ではない: $($msi.Count)" }
          # NSISは**1本に日英が入る**（`displayLanguageSelector` で選ばせる）ので、MSIと違って2つにはならない
          if ($nsis.Count -ne 1) { throw "NSISのインストーラが1つではない: $($nsis.Count)" }
          if ($zip.Count -ne 1) { throw "ポータブルZIPが1つではない: $($zip.Count)" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip[0].FullName)
          try {
            $names = $archive.Entries.FullName | ForEach-Object { $_.Replace('\', '/') }
          } finally { $archive.Dispose() }

          foreach ($need in 'pictkura.exe', 'LICENSE', 'THIRD-PARTY-LICENSES.txt') {
            if (-not ($names | Where-Object { $_.EndsWith($need) })) { throw "ZIPに $need が無い" }
          }
          if (-not ($names | Where-Object { $_ -like '*.jpg' })) { throw "ZIPにスクリーンショットが無い" }

          # **説明書は名前を並べず、リポジトリにある分と突き合わせる**。言語を足したときに
          # ここの列挙を更新し忘れて**その言語だけ黙って配布物から落ちる**のを防ぐ
          # （実際にこの穴を踏んだ——`resources` に足しただけではZIPに入らなかった）
          $want = @(Get-ChildItem "docs\manual*.html" | ForEach-Object { $_.Name })
          $got = @($names | Where-Object { $_ -match '/docs/manual[^/]*\.html$' } |
                   ForEach-Object { Split-Path $_ -Leaf })
          $missing = @($want | Where-Object { $_ -notin $got })
          if ($missing) { throw "ZIPに入っていない説明書: $($missing -join ', ')" }
          "  同梱した説明書: $($got -join ', ')"

          $msi + $nsis + $zip | ForEach-Object { "  {0,7:N1} MB  {1}" -f ($_.Length / 1MB), $_.Name }

      # **3つの入れ物の中身が、同じ1本のバイト列か。**
      #
      # `tauri-bundler` は入れ物ごとに実行ファイルを書き換えるので、**放っておくと
      # 同じビルドから3バイト違いの兄弟が3本出る**。Defender の判定はバイト列1本ごとに
      # 付くので、**それは「くじが3本」ということ**である。0.2.7 では、取り下げたのが
      # **利用者が走らせない側**だった。`tools/release.ps1` はその書き換えを先回りで
      # 止めているが、**上流が探す語の綴りを変えたら、置換は静かに空振りする。**
      # **だからここで、作った物そのものから測る。**
      #
      # **3つとも測る。2つで代用しない。** NSIS とポータブルは**どちらも同じ
      # `pictkura.exe` から来る**ので、**あの2つの一致は MSI について何も言わない**
      # ——`patch_binary` が `..._MSI` へ書き換えるのは、まさにその MSI である。
      # **取り出せなければ、この門は答えを出していないので落とす。**
      - name: 中身が1本のバイト列か
        run: |
          # **置き場は「置き場を決める」段のものを使う。** 自分で測り直さない
          # ——**測る段と上げる段が別の場所を指す**のが、この門が防ぎたい形そのものなので。
          $bundleDir = $env:PK_BUNDLE_DIR

          # **`-ErrorAction SilentlyContinue` を付けておく。** ここも `stop` で走るので、
          # 付けないと**置き場が無いだけで生の例外**になり、下に書いた
          # 「MSI が1つも無い」の枝へ**一生辿り着かない**。
          $nsis = @(Get-ChildItem "$bundleDir/nsis/*-setup.exe" -ErrorAction SilentlyContinue)[0]
          $zip = @(Get-ChildItem "$bundleDir/portable/*.zip" -ErrorAction SilentlyContinue)[0]
          $msi = @(Get-ChildItem "$bundleDir/msi/*.msi" -ErrorAction SilentlyContinue)
          # NSIS とポータブルは**この門の本体**なので、無ければここで止める
          # （7z に空のパスを渡して分かりにくく転ぶのを避ける）
          if (-not $nsis) { throw "NSIS のインストーラが無い" }
          if (-not $zip) { throw "ポータブルZIPが無い" }

          $work = Join-Path $env:RUNNER_TEMP "bundle-identity"
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          New-Item -ItemType Directory -Force $work | Out-Null

          function Get-InnerExe([string]$dir) {
            $found = @(Get-ChildItem -Recurse -File -Filter "pictkura.exe" $dir)
            if ($found.Count -ne 1) { throw "$dir から pictkura.exe を1つに絞れない: $($found.Count) 件" }
            (Get-FileHash $found[0].FullName -Algorithm SHA256).Hash
          }

          $seen = [ordered]@{}

          $portableDir = Join-Path $work "portable"
          Expand-Archive -Path $zip.FullName -DestinationPath $portableDir -Force
          $seen["portable"] = Get-InnerExe $portableDir

          # 7-Zip は windows-latest に入っていて、NSIS のインストーラを展開できる
          # **7-Zip の 1 は「警告」で、失敗ではない。** NSIS の自己展開exeでは
          # 「書庫の末尾の後ろにデータがある」で**普段から 1 が返る**。
          # ここで落とすと**毎回のリリースが止まる**ので、**判定は取り出せたかどうかに任せる**
          # （`Get-InnerExe` が 1 本に絞れなければ、そちらが落ちる）。
          # **2 以上は本物の失敗**なので、そのときは 7z の言い分ごと出す。
          # **7z の終了コードは、読んだらすぐ 0 に戻す。**
          # GitHub Actions は pwsh のステップの**末尾に
          # `if (Test-Path variable:\LASTEXITCODE) { exit $LASTEXITCODE }` を足す**ので、
          # **1 を残したまま終わると、中身が全部一致していてもステップが赤くなる。**
          # 上の「1 は警告」の手当てが、これを忘れると丸ごと無駄になる。
          # **`2>&1` を使わない**（上の tauri-cli の段と同じ理由）。
          # stderr を成功の流れへ混ぜると、`stop` の下で **`NativeCommandError` が
          # `&` の行で飛ぶ**——そうなると下の「1 は警告」も、7z の言い分を出す行も、
          # **一度も通らない**。標準出力だけ拾い、判断は終了コードでする。
          $nsisDir = Join-Path $work "nsis"
          $log = & 7z x -y "-o$nsisDir" $nsis.FullName
          $code = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($code -gt 1) {
            $log | ForEach-Object { "  7z: $_" }
            throw "NSIS のインストーラを展開できない（7z が $code）"
          }
          # **取り出せなかったときも 7z の言い分を出す。** NSIS には MSI のような
          # 代わりの手が無いので、ここで落ちると**リリースが止まる**。
          # よくあるのは「7z は 0 か 1 で終わったが、中身の名前が読めていない」形で、
          # **そのときいちばん要るのが、いま捨てようとしている一覧である。**
          try {
            $seen["nsis"] = Get-InnerExe $nsisDir
          } catch {
            $log | ForEach-Object { "  7z: $_" }
            throw
          }

          # **MSI も必ず測る。裏取りではない。**
          # 取り出しは administrative install（管理者権限は要らない）を先に試し、
          # 駄目なら 7-Zip で開く。**どちらも駄目なら、この門は答えを出せていないので落とす。**
          # **各回を try で丸ごと囲む**——`New-Item` も `Start-Process` も
          # `$p.ExitCode` も、`stop` の下では**投げればステップごと落ちる。**
          if ($msi.Count -eq 0) { throw "MSI が1つも無い" }
          $msiFailed = @()
          foreach ($m in $msi) {
            $dir = Join-Path $work "msi-$($m.BaseName)"
            $hash = $null
            foreach ($how in "msiexec", "7z") {
              try {
                if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
                New-Item -ItemType Directory -Force $dir | Out-Null
                if ($how -eq "msiexec") {
                  $p = Start-Process msiexec -ArgumentList @("/a", "`"$($m.FullName)`"", "/qn", "TARGETDIR=`"$dir`"") -Wait -PassThru
                  if ($p.ExitCode -ne 0) { throw "msiexec が $($p.ExitCode)" }
                } else {
                  # 7-Zip の 1 は警告（上の NSIS と同じ）。**取り出せたかで判じる。**
                  # ここでも読んだらすぐ 0 に戻す（ステップ末尾の `exit $LASTEXITCODE` 対策）。
                  $log = & 7z x -y "-o$dir" $m.FullName
                  $code = $LASTEXITCODE
                  $global:LASTEXITCODE = 0
                  if ($code -gt 1) {
                    $log | ForEach-Object { "  7z: $_" }
                    throw "7z が $code"
                  }
                }
                $hash = Get-InnerExe $dir
                break
              } catch {
                Write-Host "::warning::MSI を $how で取り出せなかった: $($m.Name)（$_）"
              }
            }
            if ($hash) { $seen["msi:$($m.Name)"] = $hash } else { $msiFailed += $m.Name }
          }

          $seen.GetEnumerator() | ForEach-Object { "  {0,-28} {1}" -f $_.Key, $_.Value }
          if ($msiFailed.Count -gt 0) {
            throw "MSI から中身を取り出せなかった: $($msiFailed -join ', ')。測れていない入れ物を「一致」と数えない——NSIS とポータブルはどちらも同じ実行ファイルから来るので、あの2つの一致は MSI について何も言わない"
          }
          $distinct = @($seen.Values | Sort-Object -Unique)
          if ($distinct.Count -ne 1) {
            throw "入れ物ごとに中身のバイト列が違う（$($distinct.Count) 本）。tools/release.ps1 の置換が効いていない——このまま出すと、取り下げは1本にしか効かない"
          }
          "  $($seen.Count) 個の入れ物すべてで一致: $($distinct[0])"
          # **0 で終える。** 上と同じ理由——native command の残した終了コードで
          # ステップが赤くならないように、最後に必ず畳んでおく。
          exit 0

      # **配るものの素性を測る**。plan.md は `x86_64-pc-windows-gnu` を前提にしているが、
      # ここは `windows-latest` の既定＝msvc で作っている。msvc は既定でCランタイムを
      # 動的リンクするので、`vcruntime140.dll` を要求するなら素のWindowsで
      # ポータブル版が起動しない経路が残る。**推測せず出力を見る**（門にはしない）
      - name: 依存DLLを見る
        continue-on-error: true
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Output "vswhere が無いので測れない"; return }
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $dumpbin) { Write-Output "dumpbin が無いので測れない"; return }
          rustc -vV
          & $dumpbin.FullName /dependents "$env:PK_RELEASE_DIR/pictkura.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: pictkura-windows
          path: |
            ${{ env.PK_BUNDLE_DIR }}/msi/*.msi
            ${{ env.PK_BUNDLE_DIR }}/nsis/*-setup.exe
            ${{ env.PK_BUNDLE_DIR }}/portable/*.zip
          if-no-files-found: error

  # macOS（Apple Silicon）。**Developer ID の署名も公証もしていない**ので、
  # 受け取った人は初回だけ、一度弾かれてから
  # システム設定→プライバシーとセキュリティ→「このまま開く」を踏む必要がある
  # （`xattr -dr com.apple.quarantine` でも同じ。右クリック→開くは macOS 15 以降きかない）。
  # その案内はZIPに同梱する「はじめにお読みください.txt」に書いてある
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Windows側と同じ理由。このジョブは依存のbuild.rsとnpmのスクリプトを走らせる
          persist-credentials: false

      # **アーキテクチャを推測しない**。`macos-latest` の指す実機はGitHub都合で変わる。
      # x86_64に変わったことに気付かないと、Apple Silicon専用と称してIntel版を配ることになる。
      # **本来の門は `tools/release-macos.sh` の側**（手元から呼んでも効かせるため。
      # ゲート1の指摘）。ここにも置くのは、tauri-cli の導入・npm・UIビルドという
      # 10分ぶんの支度をする**前に**落とすため——同じ判定が2箇所にあるのはそのぶん
      - name: Apple Silicon であることを確かめる
        run: |
          arch="$(uname -m)"
          echo "runner arch: $arch"
          [ "$arch" = "arm64" ] || { echo "arm64ではない: $arch"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          # **22.18 以上**（2026-09-02）。辞書のテスト（下の検査に入っている）は
          # Node が `.ts` をそのまま読めることに乗っていて、それが既定になったのが 22.18。
          # `ui/package.json` の `engines` と同じ床
          node-version: "^22.18"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # **NASMは要らない**（2026-08-14に実測）。あれはx86のアセンブラで、
      # ARM64では rav1d も libjpeg-turbo も `.S` を clang に通す。Windows側とは事情が違う
      - uses: Swatinem/rust-cache@v2

      # **Windows 側と同じ版に固定する。** あちらは「3つの入れ物に同じバイト列を入れる」
      # ために上流の実装へ乗っているので固定が要る。**こちらに同じ事情は無いが、
      # 版を揃えておかないと README の「CIと同じ版に」が片方だけ嘘になる。**
      - name: tauri-cli
        run: |
          want=2.11.4
          have=""
          # **版を訊くだけで落ちないようにする**（Windows 側と同じ理由）。
          # いまの既定シェルは `bash -e`（`pipefail` 無し）なので、これが無くても
          # `head` の 0 で助かっている——**が、あとで `shell: bash` を足した誰かが
          # `pipefail` を連れてくると、直すための `cargo install --force` へ
          # 辿り着く前に落ちる。** その仮定に寄りかからない。
          if command -v cargo-tauri >/dev/null 2>&1; then
            probe="$(cargo tauri --version 2>/dev/null || true)"
            have="$(printf '%s' "$probe" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
          fi
          if [ "$have" != "$want" ]; then
            echo "tauri-cli: ${have:-未導入} -> $want"
            cargo install tauri-cli --version "$want" --locked --force
          else
            echo "tauri-cli: $have（そのまま）"
          fi

      - name: npm の依存
        run: npm --prefix ui ci

      # Windows側と同じ理由——**タグ push では ci.yml が1行も走らない**。
      # `tauri::generate_context!` の展開に `ui/dist` が要るのでUIのビルドをテストの前に置く
      - name: 検査（タグはci.ymlを迂回するため）
        run: |
          npm --prefix ui run build
          npm --prefix ui test
          cargo fmt --all --check
          cargo test --workspace --locked

      - name: 配布物を作る
        run: bash tools/release-macos.sh

      # **数えて確かめる**。`if-no-files-found: error` は「全部空」のときしか
      # 発火しないので、ZIPは出たが中身が欠けた、を素通しする。
      # `.app` の実行ファイルに実行権が残っているかまで見るのは、`ditto` を使う
      # 理由そのものだから——ここが崩れたZIPは、展開しても起動しない
      - name: 配布物が揃っているか
        run: |
          set -euo pipefail
          # **1つであることを数える。** `target/` はキャッシュから復元されるので、
          # 版を上げた最初の実行では前の版のZIPが隣に残りうる。`ls` を素で使うと
          # 2行返って以降が全部おかしくなる（スクリプト側でも置き場ごと消しているが、
          # ここは「作った物を検める」側なので独立に数える）。
          # **`mapfile` は使わない**——macOSの `/bin/bash` は3.2で、あれが無い
          zips="$(find target/release/bundle/zip -maxdepth 1 -name '*.zip' | sort)"
          count="$(printf '%s' "$zips" | grep -c . || true)"
          if [ "$count" -ne 1 ]; then
            echo "$zips"
            echo "ZIPが1つではない: $count"; exit 1
          fi
          zip="$zips"

          work="$(mktemp -d)"
          ditto -x -k "$zip" "$work"
          app="$(find "$work" -maxdepth 2 -name 'pictkura.app' -type d)"
          [ -n "$app" ] || { echo "ZIPに pictkura.app が無い"; exit 1; }

          for need in \
            "$app/Contents/MacOS/pictkura" \
            "$app/Contents/Info.plist" \
            "$app/Contents/Resources/_up_/THIRD-PARTY-LICENSES.txt"
          do
            [ -e "$need" ] || { echo "$need が無い"; exit 1; }
          done
          [ -x "$app/Contents/MacOS/pictkura" ] || { echo "実行権が落ちている"; exit 1; }
          ls "$app/Contents/Resources/_up_/docs/images/"*.jpg >/dev/null

          # **説明書は名前を並べず、リポジトリにある分と突き合わせる**（Windows側と
          # 同じ理由）。列挙を1箇所だけ直して**macOSだけ落ちる**のを防ぐ
          for m in docs/manual*.html; do
            name="$(basename "$m")"
            [ -e "$app/Contents/Resources/_up_/docs/$name" ] || {
              echo ".app に入っていない説明書: $name"; exit 1; }
          done
          ls "$app/Contents/Resources/_up_/docs/"manual*.html | xargs -n1 basename

          # **署名の整合をZIPから出したもので見る**。arm64のリンカは実行ファイルに
          # 勝手にad-hoc署名を付けるので、バンドルを署名し忘れると
          # 「実行ファイルは署名済みだがバンドルには `_CodeSignature` が無い」という
          # **未署名より悪い状態**になり、quarantineを外しても弾かれる経路が残る。
          # `tauri.macos.conf.json` の `signingIdentity: "-"` がそれを防いでいる。
          # ZIPを経由して見るのは、`ditto` が署名を保つことまで込みで確かめるため
          codesign -v --verbose=2 "$app"
          # **パイプで `grep -q` へ渡さない。** `grep -q` は一致した時点で終わるので、
          # まだ書いている `codesign` がSIGPIPEで死に、`pipefail` が拾って
          # 終了141になる。**正しくad-hoc署名されたアプリで、気まぐれに落ちる**
          # （ゲート2の指摘）。先に受け取ってから見る
          sig="$(codesign -dvv "$app" 2>&1)"
          grep -q "^Signature=adhoc" <<<"$sig" || { echo "$sig"; echo "ad-hoc署名ではない"; exit 1; }

          for need in "はじめにお読みください.txt" LICENSE THIRD-PARTY-LICENSES.txt; do
            [ -e "$(dirname "$app")/$need" ] || { echo "ZIPに $need が無い"; exit 1; }
          done

          ls -lh "$zip" | awk '{ printf "  %7s  %s\n", $5, $9 }'

      # **配るものの素性を測る**。Windows側で `dumpbin /dependents` を見るのと同じ趣旨。
      # 署名の状態（未署名なら adhoc）と、本当にarm64単体かを出す。**門にはしない**
      - name: 素性を見る
        continue-on-error: true
        run: |
          app="target/release/bundle/macos/pictkura.app"
          rustc -vV
          file "$app/Contents/MacOS/pictkura"
          lipo -info "$app/Contents/MacOS/pictkura" || true
          codesign -dvv "$app" 2>&1 || true
          otool -L "$app/Contents/MacOS/pictkura" | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: pictkura-macos
          path: target/release/bundle/zip/*.zip
          if-no-files-found: error

  # **両方が揃ってから1回だけ載せる。** ここだけが書き込み権を持つ
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    # **タグを push したときだけ**載せる。workflow_dispatch はタグの ref も選べるので、
    # `startsWith(github.ref, ...)` だけだと手動実行で公開してしまう
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      # `gh release create` がリリースを作るのに要る
      contents: write
    steps:
      # **タグと `tauri.conf.json` の版が一致していることを先に見る。**
      # 配布物の名前はすべて `tauri.conf.json` の `version` から付く（macOSは
      # `release-macos.sh`、MSIはTauri自身）。上げ忘れたまま `v0.2.0` を押すと、
      # 「v0.2.0」という名前のReleaseに `pictkura_0.1.0_*` が4つ並び、
      # **員数確認は4つなので素通りする**（ゲート2の指摘）。
      # ここだけは版を読むためにチェックアウトが要る（浅くていい）
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # 版の突き合わせに `tauri.conf.json`、本文に手書きのリリースノート
          sparse-checkout: |
            src-tauri/tauri.conf.json
            docs/release-notes
          sparse-checkout-cone-mode: false

      - name: タグと版が一致しているか
        run: |
          set -euo pipefail
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "v$conf" != "$GITHUB_REF_NAME" ]; then
            echo "タグ($GITHUB_REF_NAME)と tauri.conf.json の版(v$conf)が違う"
            echo "配布物の名前は tauri.conf.json 側から付くので、揃えてから打ち直すこと"
            exit 1
          fi
          echo "版: v$conf"

      # 名前を指定せず全部取る（`pictkura-windows` と `pictkura-macos`）
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Release に載せる
        env:
          GH_TOKEN: ${{ github.token }}
          # **`checkout` していないので `gh` はリポジトリを知らない。**
          # git の作業ツリーから推測できないぶん、ここで明示しないと
          # 「not a git repository」で落ちる
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(find dist -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.zip' \) | sort)

          # **数えて確かめる**。MSI 2言語＋NSIS 1本＋ポータブルZIP＋macOSのZIP＝5つ。
          # 欠けたまま公開すると「Windows版が無いRelease」が静かに出来る
          if [ "${#files[@]}" -ne 5 ]; then
            printf '%s\n' "${files[@]}"
            echo "配布物が5つ（MSI×2・NSIS・ポータブルZIP・macOS ZIP）ではない: ${#files[@]}"
            exit 1
          fi
          printf '  %s\n' "${files[@]}"

          # **ダイジェストを出す。** 署名の証明書を持っていない以上、こちらから出せる
          # 材料はこれしかない。**「安全である」ことの証明ではない**——同じ人が作った物に
          # 同じ人が判子を押しているだけで、言えるのは「手元のファイルが、ここに載って
          # いるものと同じバイト列か」だけである。それでも効く用途が2つある:
          # **再配布先（Softpedia など）から落としたものを突き合わせる**のと、
          # **後から差し替えられていないかを見る**の。
          # 置き場（`dist/pictkura-windows/`）は受け取る側に無いので、名前だけを載せる
          sums="$RUNNER_TEMP/SHA256SUMS.txt"
          : > "$sums"
          for f in "${files[@]}"; do
            ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" ) >> "$sums"
          done
          cat "$sums"

          # 本文は `docs/release-notes/<タグ>.md` があればそれを載せる。
          # **リポジトリに置く**のが要点——GitHub側で直に書くと、利用者が最初に
          # 読む文章だけがレビューの門を通らずに出る。無ければ従来どおり
          # 自動生成（マージしたPRの一覧）に落とす。
          # **ダイジェストだけは後ろに継ぐ**——ビルドが終わるまで存在しないので
          # リポジトリ側には置けない。継ぐ文言もここに書いてあるぶんPRの門を通る。
          # **継ぐのは手書きのノートがあるときだけ**（ゲート1のP2・据え置き）。
          # 自動生成へ落ちる枝は、`--generate-notes` が作った本文を読み戻してから
          # 継ぎ直さないと足せず、**リリースが出来た後に増えるAPI呼び出しと
          # `gh release edit`** を、既に何かが狂っている枝へ足すことになる。
          # 見返りは薄い——`SHA256SUMS.txt` は**どちらの枝でも必ず付く**し、
          # サイトが案内しているのは GitHub 自身が持つダイジェスト
          # （`/releases/tags/<tag>` のAPI）で、そちらは本文と無関係に引ける。
          # 本文の節は正常な道の便宜であって、確かめる手立てそのものではない
          notes="docs/release-notes/$GITHUB_REF_NAME.md"
          body="$RUNNER_TEMP/body.md"
          # **中身があるかまで見る**（`-f` だけだと、sparse-checkout の書き方を
          # 間違えて空で落ちてきたときに「本文が空のRelease」が黙って出る）
          if [ -s "$notes" ]; then
            echo "リリースノート: $notes"
            cp "$notes" "$body"
            {
              printf '\n\n---\n\n## SHA-256\n\n'
              printf 'Digests of the five build artifacts, computed on the runner that publishes\n'
              printf 'them. The same listing is attached as SHA256SUMS.txt. On macOS,\n'
              printf '`shasum -a 256 --ignore-missing -c SHA256SUMS.txt` checks whichever of them\n'
              printf 'you have in the current directory — without --ignore-missing it reports the\n'
              printf 'ones you did not download as FAILED. On Windows nothing built in reads a sums\n'
              printf 'file, so hash yours with `Get-FileHash <file> -Algorithm SHA256`.\n'
              printf 'They tell you whether the file you are holding is byte for byte the one\n'
              printf 'published here — not that it is safe. The same person who built it wrote\n'
              printf 'these numbers.\n\n'
              printf 'GitHub computes its own digest for every asset, from the bytes it stores, and\n'
              printf 'that one we did not write. Ask it directly:\n\n'
              printf '```\n'
              printf 'curl -s https://api.github.com/repos/%s/releases/tags/%s | grep -E \x27"name"|"digest"\x27\n' \
                "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
              printf '```\n\n'
              printf 'このリリースの配布物5点の、**公開する機械で計算した**ダイジェストです。\n'
              printf '同じ一覧は `SHA256SUMS.txt` としても付けてあります。macOS なら\n'
              printf '`shasum -a 256 --ignore-missing -c SHA256SUMS.txt` で、そのフォルダに\n'
              printf 'あるぶんだけ確かめられます（`--ignore-missing` を外すと、落として\n'
              printf 'いないファイルが FAILED として並びます）。Windows には一覧を読む標準の\n'
              printf '道具が無いので、`Get-FileHash <ファイル> -Algorithm SHA256` になります。\n'
              printf '分かるのは**手元のファイルが、ここに載っているものと\n'
              printf '同じバイト列か**だけで、安全であることの証明にはなりません（作った本人が\n'
              printf '押した判子です）。**GitHub 自身も保管しているバイト列から独自に計算した値を\n'
              printf '持っています**——上のコマンドで引けるほうは、こちらが書いた数字ではありません。\n\n'
              printf '```\n'
              cat "$sums"
              printf '```\n'
            } >> "$body"
          else
            echo "リリースノートが無いので自動生成にする: $notes"
            : > "$body"
          fi

          # **ダイジェストの一覧もファイルとして付ける**（本文からのコピーで済ませない）。
          # `shasum -a 256 --ignore-missing -c` がそのまま通る形（`<digest>  <名前>`）に
          # しておくと、macOSの人は目で突き合わせずに済む。**`sha256sum` とは書かない**——
          # あれはGNU coreutilsの名前で、**配っている2つのOSのどちらにも無い**
          # （macOSは `shasum`、Windowsには一覧を読む道具そのものが無い。ゲート2の指摘）。
          # **`--ignore-missing` も落とさない。** 5行の一覧に対して手元が1ファイルだと、
          # 素の `-c` は `FAILED open or read` を4行出して終了1を返す（shasum 6.02 で実測）。
          # ふつうの人は1つしか落とさないので、**それが既定の見え方になる**。
          # 上の員数確認（5つ）を通した**後**に足す——先に足すと6つになって落ちる
          files+=("$sums")

          if [ -s "$body" ]; then
            notes_args=(--notes-file "$body")
          else
            notes_args=(--generate-notes)
          fi

          # **下書きで作る。公開は人が押す。**
          # `docs/assets/download.js` は実行時に `releases/latest` を読んで
          # ダウンロードのリンクを埋める（HTMLに書いてある版は、取得できなかった
          # ときのフォールバック）。つまり**公開した瞬間、サイトは新しい版を配り始める**
          # ——実機で全通しをやっている最中もずっとである。**下書きは
          # `releases/latest` に出ない**ので、資産だけ先に作って、確かめてから配れる。
          #
          # **確かめたら、これで公開する**:
          #
          #     gh release edit vX.Y.Z --draft=false
          #
          # 押し忘れると誰にも届かない。**タグを押した日のうちに確かめること。**
          #
          # **下書きの配布物は、公開のURLでは落とせない**（認証が要る。素の
          # `curl` も、リンクを踏んだ人も404）。実機で確かめる側は
          # `gh release download vX.Y.Z` を使うこと
          # **「作ってみて、失敗したら貼り直す」ではなく、先に有無を見る。**
          # タグの重複を GitHub が拒むのは**公開済みのRelease に対してだけ**で、
          # **同じタグの下書きは何個でも作れる**（下書きはタグを握らない）。
          # 下書きにしたこの経路で `create` に頼ると、やり直しのたびに
          # **v0.2.7 の下書きが2つ**でき、`gh release edit --draft=false` は
          # そのどちらか一方しか掴まない——**古い配布物や古い本文のほうを
          # 公開しうる**。それは下の貼り直しが防ぐために書かれたものそのものである
          # （ゲート2の指摘）
          # **1回だけ引いて、3つに分ける。**
          #
          # - **公開済み … 触らない。** `gh release view` は公開済みでも通るので、
          #   「あれば貼り直す」だけだと、**回し直しが公開中のRelease の配布物と本文を
          #   その場で差し替える**——実機で確かめて Defender も通した**あのバイト列が、
          #   誰にも知られずに別のビルドへ入れ替わる**（ゲート1のP2）。
          #   差し替えたいなら版を切り直すこと
          # - **下書きがある … 貼り直す。** ビルドに時間がかかるので、公開前の
          #   やり直しは許す
          # - **無い … 下書きで作る**
          #
          # **「引けなかった」を「無い」と読まない**（ゲート1のP2）。API の瞬断・
          # 認証切れ・レート制限で `view` が転んだだけのときに `create` へ落ちると、
          # **同じタグの下書きが2つ**できる——タグの重複を GitHub が拒むのは
          # **公開済みに対してだけ**なので、下書きは何個でも通ってしまう。
          # **本当に無いと言えたときだけ作る。** 言えなければ落として知らせる
          view_err="$RUNNER_TEMP/release-view.err"
          if is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>"$view_err"); then
            if [ "$is_draft" != "true" ]; then
              echo "::error::$GITHUB_REF_NAME は既に公開済みです。公開済みのRelease の配布物は差し替えません（版を切り直してください）"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            # 貼り直せるのは**手書きのノートがあるときだけ**。`gh release edit` に
            # `--generate-notes` は無い（自動生成は create でしか作れない）ので、
            # `notes_args` をそのまま渡すと未知のフラグで落ちる。
            # **本文も貼り直す**——初回が自動生成に落ちた後でノートを足して回し直した
            # ときに、配布物だけ新しくて本文が古いRelease が残らないように
            if [ -s "$body" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file "$body"
            fi
          elif grep -qi 'not found' "$view_err"; then
            # **ここが転んだら、この実行の中では直らない**（ゲート2のlow）。
            # 以前は「`create` が失敗したら貼り直す」形だったので、Release は
            # 出来たのに配布物の1つが上げ損ねた、という半端な失敗をその場で
            # 拾い直せた。いまは `create` が `else` の側にあり `set -e` なので、
            # **5点のうち2〜4点だけ付いた下書きを残してジョブが落ちる**。
            # 直し方は**この `publish` ジョブを回し直すだけ**——上の枝が
            # 下書きを見つけて `--clobber` で貼り直す。配布物は成果物として
            # 残っているので作り直しは要らない
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" "${notes_args[@]}" "${files[@]}"
          else
            cat "$view_err" >&2
            echo "::error::Release の有無を確かめられませんでした。作らずに止めます（回し直してください）"
            exit 1
          fi

          # **やり残しを、人が見る場所に出す。** コメントに書いても Actions の
          # 画面には出ない。ジョブは緑で終わるので、**下書きのまま忘れられると
          # 誰にも届かない**（下書きは `releases/latest` に出ないので、サイトは
          # 古い版を配り続ける。それ自体は安全側だが、気付けないのは別の話）
          {
            printf '## まだ公開していません（下書きです）\n\n'
            printf '実機で確かめてから、これで公開します:\n\n'
            printf '```\n'
            printf 'gh release edit %s --draft=false\n' "$GITHUB_REF_NAME"
            printf '```\n\n'
            printf '**下書きの配布物は、認証なしでは落とせません**（公開の URL は404）。\n'
            # バッククォートは `\x60` で書く。素で置くとコマンド置換のつもりと
            # 見なされて shellcheck の SC2016 が増える（この段の `\x27` と同じ理由）
            printf '確かめる側は \x60gh release download %s\x60 を使ってください。\n' "$GITHUB_REF_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
