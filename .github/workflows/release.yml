# 配布物を作る。
#
#   Windows … MSI ja-JP / en-US ＋ 持ち歩き版ZIP
#   macOS   … pictkura.app を収めたZIP（Apple Silicon 専用・未署名）
#
# **手元のスクリプト（`tools/release.ps1` / `tools/release-macos.sh`）を
# そのまま呼ぶ**のが要点。CIに手順を書き写すと二重管理になり、
# 「手元では出るのにCIでは出ない」が静かに生まれる。
# UIのビルドを先に走らせる理由もあのスクリプトのコメントに書いてある。
#
# 動かし方は2通り:
#   - `v0.1.0` のようなタグを push  … Releases に配布物が付く
#   - 手動実行（workflow_dispatch）  … 成果物だけ作って中身を確かめる
#
# **公開は別ジョブ（`publish`）に切り出してある。** 各ビルドジョブが自分で
# `gh release create` すると、2つが同時に同じReleaseを作りにいって競り合ううえ、
# 片方が落ちたときに**片OSだけのリリースが出来てしまう**。両方揃ってから1回だけ載せる。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 同じタグを2回押しても、同じReleaseを2つのジョブが触りにいかないようにする。
# **途中で止めない**（配布物を作りかけで捨てない）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 既定は読めれば足りる。書き込みは `publish` だけが自分で引き上げる
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 既定では書き込み権のあるトークンが .git/config に平文で残る。
          # このジョブは依存のbuild.rsとnpmのスクリプトを走らせるので置かない
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # rav1d（AVIF）と mozjpeg のアセンブリに要る。**外すと6倍遅くなる**。
      # 版を固定するのは、これが**配布バイナリの中身に直接効く入力**だから
      - name: NASM を入れる
        run: |
          choco install nasm -y --no-progress --version=3.2.0
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@v2

      # MSIを作るのに要る。`--features cli` は不要（plan.md の引き継ぎ節）。
      # ~/.cargo/bin は上のキャッシュに乗るが、**キャッシュはrefごと**なので
      # タグからの実行では基本コールドになる（mainでの手動実行が温めた場合だけ効く）
      - name: tauri-cli
        run: |
          if (-not (Get-Command cargo-tauri -ErrorAction SilentlyContinue)) {
            cargo install tauri-cli --version "^2.0" --locked
          }

      - name: npm の依存
        run: npm --prefix ui ci

      # **タグ push では ci.yml が1行も走らない**（`branches:` フィルタは tag ref に
      # マッチしない）。ここで検査しないと、CIが赤のコミットへタグを打つだけで
      # 未検査の配布物がReleasesに載る。UIのビルドは release.ps1 が改めて行うが、
      # `tauri::generate_context!` の展開に `ui/dist` が要るのでテストの前に置く。
      # clippy は書式・作法の門なので main 側（ci.yml）に任せ、ここでは正しさだけ見る
      - name: 検査（タグはci.ymlを迂回するため）
        run: |
          npm --prefix ui run build
          cargo fmt --all --check
          cargo test --workspace --locked

      # WiX は tauri-cli が必要になった時点で自分で取ってくる
      - name: 配布物を作る
        run: pwsh tools/release.ps1

      # **数えて確かめる**。`if-no-files-found: error` は検索結果が「全部空」の
      # ときしか発火しないので、MSIだけ出てZIPが出ない・言語が1つ欠けた、を素通しする。
      # ZIPの中身も見るのは、アプリが実行ファイルの隣から取説とライセンス一覧を
      # 探すため——並びが崩れると「同梱されていません」になる（pack-portable.ps1）
      - name: 配布物が揃っているか
        run: |
          $msi = @(Get-ChildItem "target\release\bundle\msi\*.msi" -ErrorAction SilentlyContinue)
          $nsis = @(Get-ChildItem "target\release\bundle\nsis\*-setup.exe" -ErrorAction SilentlyContinue)
          $zip = @(Get-ChildItem "target\release\bundle\portable\*.zip" -ErrorAction SilentlyContinue)
          if ($msi.Count -ne 2) { throw "MSIが2つ（ja-JP / en-US）ではない: $($msi.Count)" }
          # NSISは**1本に日英が入る**（`displayLanguageSelector` で選ばせる）ので、MSIと違って2つにはならない
          if ($nsis.Count -ne 1) { throw "NSISのインストーラが1つではない: $($nsis.Count)" }
          if ($zip.Count -ne 1) { throw "ポータブルZIPが1つではない: $($zip.Count)" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip[0].FullName)
          try {
            $names = $archive.Entries.FullName | ForEach-Object { $_.Replace('\', '/') }
          } finally { $archive.Dispose() }

          foreach ($need in 'pictkura.exe', 'LICENSE', 'THIRD-PARTY-LICENSES.txt') {
            if (-not ($names | Where-Object { $_.EndsWith($need) })) { throw "ZIPに $need が無い" }
          }
          if (-not ($names | Where-Object { $_ -like '*.jpg' })) { throw "ZIPにスクリーンショットが無い" }

          # **説明書は名前を並べず、リポジトリにある分と突き合わせる**。言語を足したときに
          # ここの列挙を更新し忘れて**その言語だけ黙って配布物から落ちる**のを防ぐ
          # （実際にこの穴を踏んだ——`resources` に足しただけではZIPに入らなかった）
          $want = @(Get-ChildItem "docs\manual*.html" | ForEach-Object { $_.Name })
          $got = @($names | Where-Object { $_ -match '/docs/manual[^/]*\.html$' } |
                   ForEach-Object { Split-Path $_ -Leaf })
          $missing = @($want | Where-Object { $_ -notin $got })
          if ($missing) { throw "ZIPに入っていない説明書: $($missing -join ', ')" }
          "  同梱した説明書: $($got -join ', ')"

          $msi + $nsis + $zip | ForEach-Object { "  {0,7:N1} MB  {1}" -f ($_.Length / 1MB), $_.Name }

      # **配るものの素性を測る**。plan.md は `x86_64-pc-windows-gnu` を前提にしているが、
      # ここは `windows-latest` の既定＝msvc で作っている。msvc は既定でCランタイムを
      # 動的リンクするので、`vcruntime140.dll` を要求するなら素のWindowsで
      # ポータブル版が起動しない経路が残る。**推測せず出力を見る**（門にはしない）
      - name: 依存DLLを見る
        continue-on-error: true
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Output "vswhere が無いので測れない"; return }
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $dumpbin) { Write-Output "dumpbin が無いので測れない"; return }
          rustc -vV
          & $dumpbin.FullName /dependents target\release\pictkura.exe

      - uses: actions/upload-artifact@v4
        with:
          name: pictkura-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/portable/*.zip
          if-no-files-found: error

  # macOS（Apple Silicon）。**Developer ID の署名も公証もしていない**ので、
  # 受け取った人は初回だけ、一度弾かれてから
  # システム設定→プライバシーとセキュリティ→「このまま開く」を踏む必要がある
  # （`xattr -dr com.apple.quarantine` でも同じ。右クリック→開くは macOS 15 以降きかない）。
  # その案内はZIPに同梱する「はじめにお読みください.txt」に書いてある
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Windows側と同じ理由。このジョブは依存のbuild.rsとnpmのスクリプトを走らせる
          persist-credentials: false

      # **アーキテクチャを推測しない**。`macos-latest` の指す実機はGitHub都合で変わる。
      # x86_64に変わったことに気付かないと、Apple Silicon専用と称してIntel版を配ることになる。
      # **本来の門は `tools/release-macos.sh` の側**（手元から呼んでも効かせるため。
      # ゲート1の指摘）。ここにも置くのは、tauri-cli の導入・npm・UIビルドという
      # 10分ぶんの支度をする**前に**落とすため——同じ判定が2箇所にあるのはそのぶん
      - name: Apple Silicon であることを確かめる
        run: |
          arch="$(uname -m)"
          echo "runner arch: $arch"
          [ "$arch" = "arm64" ] || { echo "arm64ではない: $arch"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # **NASMは要らない**（2026-08-14に実測）。あれはx86のアセンブラで、
      # ARM64では rav1d も libjpeg-turbo も `.S` を clang に通す。Windows側とは事情が違う
      - uses: Swatinem/rust-cache@v2

      - name: tauri-cli
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            cargo install tauri-cli --version "^2.0" --locked
          fi

      - name: npm の依存
        run: npm --prefix ui ci

      # Windows側と同じ理由——**タグ push では ci.yml が1行も走らない**。
      # `tauri::generate_context!` の展開に `ui/dist` が要るのでUIのビルドをテストの前に置く
      - name: 検査（タグはci.ymlを迂回するため）
        run: |
          npm --prefix ui run build
          cargo fmt --all --check
          cargo test --workspace --locked

      - name: 配布物を作る
        run: bash tools/release-macos.sh

      # **数えて確かめる**。`if-no-files-found: error` は「全部空」のときしか
      # 発火しないので、ZIPは出たが中身が欠けた、を素通しする。
      # `.app` の実行ファイルに実行権が残っているかまで見るのは、`ditto` を使う
      # 理由そのものだから——ここが崩れたZIPは、展開しても起動しない
      - name: 配布物が揃っているか
        run: |
          set -euo pipefail
          # **1つであることを数える。** `target/` はキャッシュから復元されるので、
          # 版を上げた最初の実行では前の版のZIPが隣に残りうる。`ls` を素で使うと
          # 2行返って以降が全部おかしくなる（スクリプト側でも置き場ごと消しているが、
          # ここは「作った物を検める」側なので独立に数える）。
          # **`mapfile` は使わない**——macOSの `/bin/bash` は3.2で、あれが無い
          zips="$(find target/release/bundle/zip -maxdepth 1 -name '*.zip' | sort)"
          count="$(printf '%s' "$zips" | grep -c . || true)"
          if [ "$count" -ne 1 ]; then
            echo "$zips"
            echo "ZIPが1つではない: $count"; exit 1
          fi
          zip="$zips"

          work="$(mktemp -d)"
          ditto -x -k "$zip" "$work"
          app="$(find "$work" -maxdepth 2 -name 'pictkura.app' -type d)"
          [ -n "$app" ] || { echo "ZIPに pictkura.app が無い"; exit 1; }

          for need in \
            "$app/Contents/MacOS/pictkura" \
            "$app/Contents/Info.plist" \
            "$app/Contents/Resources/_up_/THIRD-PARTY-LICENSES.txt"
          do
            [ -e "$need" ] || { echo "$need が無い"; exit 1; }
          done
          [ -x "$app/Contents/MacOS/pictkura" ] || { echo "実行権が落ちている"; exit 1; }
          ls "$app/Contents/Resources/_up_/docs/images/"*.jpg >/dev/null

          # **説明書は名前を並べず、リポジトリにある分と突き合わせる**（Windows側と
          # 同じ理由）。列挙を1箇所だけ直して**macOSだけ落ちる**のを防ぐ
          for m in docs/manual*.html; do
            name="$(basename "$m")"
            [ -e "$app/Contents/Resources/_up_/docs/$name" ] || {
              echo ".app に入っていない説明書: $name"; exit 1; }
          done
          ls "$app/Contents/Resources/_up_/docs/"manual*.html | xargs -n1 basename

          # **署名の整合をZIPから出したもので見る**。arm64のリンカは実行ファイルに
          # 勝手にad-hoc署名を付けるので、バンドルを署名し忘れると
          # 「実行ファイルは署名済みだがバンドルには `_CodeSignature` が無い」という
          # **未署名より悪い状態**になり、quarantineを外しても弾かれる経路が残る。
          # `tauri.macos.conf.json` の `signingIdentity: "-"` がそれを防いでいる。
          # ZIPを経由して見るのは、`ditto` が署名を保つことまで込みで確かめるため
          codesign -v --verbose=2 "$app"
          # **パイプで `grep -q` へ渡さない。** `grep -q` は一致した時点で終わるので、
          # まだ書いている `codesign` がSIGPIPEで死に、`pipefail` が拾って
          # 終了141になる。**正しくad-hoc署名されたアプリで、気まぐれに落ちる**
          # （ゲート2の指摘）。先に受け取ってから見る
          sig="$(codesign -dvv "$app" 2>&1)"
          grep -q "^Signature=adhoc" <<<"$sig" || { echo "$sig"; echo "ad-hoc署名ではない"; exit 1; }

          for need in "はじめにお読みください.txt" LICENSE THIRD-PARTY-LICENSES.txt; do
            [ -e "$(dirname "$app")/$need" ] || { echo "ZIPに $need が無い"; exit 1; }
          done

          ls -lh "$zip" | awk '{ printf "  %7s  %s\n", $5, $9 }'

      # **配るものの素性を測る**。Windows側で `dumpbin /dependents` を見るのと同じ趣旨。
      # 署名の状態（未署名なら adhoc）と、本当にarm64単体かを出す。**門にはしない**
      - name: 素性を見る
        continue-on-error: true
        run: |
          app="target/release/bundle/macos/pictkura.app"
          rustc -vV
          file "$app/Contents/MacOS/pictkura"
          lipo -info "$app/Contents/MacOS/pictkura" || true
          codesign -dvv "$app" 2>&1 || true
          otool -L "$app/Contents/MacOS/pictkura" | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: pictkura-macos
          path: target/release/bundle/zip/*.zip
          if-no-files-found: error

  # **両方が揃ってから1回だけ載せる。** ここだけが書き込み権を持つ
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    # **タグを push したときだけ**載せる。workflow_dispatch はタグの ref も選べるので、
    # `startsWith(github.ref, ...)` だけだと手動実行で公開してしまう
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      # `gh release create` がリリースを作るのに要る
      contents: write
    steps:
      # **タグと `tauri.conf.json` の版が一致していることを先に見る。**
      # 配布物の名前はすべて `tauri.conf.json` の `version` から付く（macOSは
      # `release-macos.sh`、MSIはTauri自身）。上げ忘れたまま `v0.2.0` を押すと、
      # 「v0.2.0」という名前のReleaseに `pictkura_0.1.0_*` が4つ並び、
      # **員数確認は4つなので素通りする**（ゲート2の指摘）。
      # ここだけは版を読むためにチェックアウトが要る（浅くていい）
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # 版の突き合わせに `tauri.conf.json`、本文に手書きのリリースノート
          sparse-checkout: |
            src-tauri/tauri.conf.json
            docs/release-notes
          sparse-checkout-cone-mode: false

      - name: タグと版が一致しているか
        run: |
          set -euo pipefail
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "v$conf" != "$GITHUB_REF_NAME" ]; then
            echo "タグ($GITHUB_REF_NAME)と tauri.conf.json の版(v$conf)が違う"
            echo "配布物の名前は tauri.conf.json 側から付くので、揃えてから打ち直すこと"
            exit 1
          fi
          echo "版: v$conf"

      # 名前を指定せず全部取る（`pictkura-windows` と `pictkura-macos`）
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Release に載せる
        env:
          GH_TOKEN: ${{ github.token }}
          # **`checkout` していないので `gh` はリポジトリを知らない。**
          # git の作業ツリーから推測できないぶん、ここで明示しないと
          # 「not a git repository」で落ちる
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(find dist -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.zip' \) | sort)

          # **数えて確かめる**。MSI 2言語＋NSIS 1本＋ポータブルZIP＋macOSのZIP＝5つ。
          # 欠けたまま公開すると「Windows版が無いRelease」が静かに出来る
          if [ "${#files[@]}" -ne 5 ]; then
            printf '%s\n' "${files[@]}"
            echo "配布物が5つ（MSI×2・NSIS・ポータブルZIP・macOS ZIP）ではない: ${#files[@]}"
            exit 1
          fi
          printf '  %s\n' "${files[@]}"

          # **ダイジェストを出す。** 署名の証明書を持っていない以上、こちらから出せる
          # 材料はこれしかない。**「安全である」ことの証明ではない**——同じ人が作った物に
          # 同じ人が判子を押しているだけで、言えるのは「手元のファイルが、ここに載って
          # いるものと同じバイト列か」だけである。それでも効く用途が2つある:
          # **再配布先（Softpedia など）から落としたものを突き合わせる**のと、
          # **後から差し替えられていないかを見る**の。
          # 置き場（`dist/pictkura-windows/`）は受け取る側に無いので、名前だけを載せる
          sums="$RUNNER_TEMP/SHA256SUMS.txt"
          : > "$sums"
          for f in "${files[@]}"; do
            ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" ) >> "$sums"
          done
          cat "$sums"

          # 本文は `docs/release-notes/<タグ>.md` があればそれを載せる。
          # **リポジトリに置く**のが要点——GitHub側で直に書くと、利用者が最初に
          # 読む文章だけがレビューの門を通らずに出る。無ければ従来どおり
          # 自動生成（マージしたPRの一覧）に落とす。
          # **ダイジェストだけは後ろに継ぐ**——ビルドが終わるまで存在しないので
          # リポジトリ側には置けない。継ぐ文言もここに書いてあるぶんPRの門を通る。
          # **継ぐのは手書きのノートがあるときだけ**（ゲート1のP2・据え置き）。
          # 自動生成へ落ちる枝は、`--generate-notes` が作った本文を読み戻してから
          # 継ぎ直さないと足せず、**リリースが出来た後に増えるAPI呼び出しと
          # `gh release edit`** を、既に何かが狂っている枝へ足すことになる。
          # 見返りは薄い——`SHA256SUMS.txt` は**どちらの枝でも必ず付く**し、
          # サイトが案内しているのは GitHub 自身が持つダイジェスト
          # （`/releases/tags/<tag>` のAPI）で、そちらは本文と無関係に引ける。
          # 本文の節は正常な道の便宜であって、確かめる手立てそのものではない
          notes="docs/release-notes/$GITHUB_REF_NAME.md"
          body="$RUNNER_TEMP/body.md"
          # **中身があるかまで見る**（`-f` だけだと、sparse-checkout の書き方を
          # 間違えて空で落ちてきたときに「本文が空のRelease」が黙って出る）
          if [ -s "$notes" ]; then
            echo "リリースノート: $notes"
            cp "$notes" "$body"
            {
              printf '\n\n---\n\n## SHA-256\n\n'
              printf 'Digests of the five build artifacts, computed on the runner that built them.\n'
              printf 'The same listing is attached as SHA256SUMS.txt, so once you have downloaded\n'
              printf 'them into one directory, `sha256sum -c SHA256SUMS.txt` checks them all.\n'
              printf 'They tell you whether the file you are holding is byte for byte the one\n'
              printf 'published here — not that it is safe. The same person who built it wrote\n'
              printf 'these numbers.\n\n'
              printf 'GitHub computes its own digest for every asset, from the bytes it stores, and\n'
              printf 'that one we did not write. Ask it directly:\n\n'
              printf '```\n'
              printf 'curl -s https://api.github.com/repos/%s/releases/tags/%s | grep -E \x27"name"|"digest"\x27\n' \
                "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
              printf '```\n\n'
              printf 'このリリースの配布物5点の、**ビルドした機械で計算した**ダイジェストです。\n'
              printf '同じ一覧は `SHA256SUMS.txt` としても付けてあるので、1つのフォルダへ\n'
              printf '落としてから `sha256sum -c SHA256SUMS.txt` を通せます。\n'
              printf '分かるのは**手元のファイルが、ここに載っているものと\n'
              printf '同じバイト列か**だけで、安全であることの証明にはなりません（作った本人が\n'
              printf '押した判子です）。**GitHub 自身も保管しているバイト列から独自に計算した値を\n'
              printf '持っています**——上のコマンドで引けるほうは、こちらが書いた数字ではありません。\n\n'
              printf '```\n'
              cat "$sums"
              printf '```\n'
            } >> "$body"
          else
            echo "リリースノートが無いので自動生成にする: $notes"
            : > "$body"
          fi

          # **ダイジェストの一覧もファイルとして付ける**（本文からのコピーで済ませない）。
          # `sha256sum -c SHA256SUMS.txt` がそのまま通る形にしておくと、
          # 受け取った側が目で突き合わせずに確かめられる。
          # 上の員数確認（5つ）を通した**後**に足す——先に足すと6つになって落ちる
          files+=("$sums")

          if [ -s "$body" ]; then
            notes_args=(--notes-file "$body")
          else
            notes_args=(--generate-notes)
          fi

          if ! gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" "${notes_args[@]}" "${files[@]}"; then
            # 既にあるなら貼り直す（ビルドに時間がかかるので、公開だけのやり直しを許す）。
            # **本文も貼り直す**——初回が自動生成に落ちた後でノートを足して回し直した
            # ときに、配布物だけ新しくて本文が古いRelease が残らないように
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            # 貼り直せるのは**手書きのノートがあるときだけ**。`gh release edit` に
            # `--generate-notes` は無い（自動生成は create でしか作れない）ので、
            # `notes_args` をそのまま渡すと未知のフラグで落ちる
            if [ -s "$body" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file "$body"
            fi
          fi
