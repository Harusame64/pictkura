# 変更のたびに「壊れていないこと」だけを見る（配布物は release.yml で作る）。
#
# **Windowsが本命**。このリポジトリはOSに寄り添う部分が多く
# （WIC・Shell・USNジャーナル）、`cfg(windows)` の側はWindows以外では
# 1行もコンパイルされない。Linuxで緑になっても何も保証しない。
#
# **macOSも配るようになったので足した**（2026-08-14）。rav1d 1.1.0 の
# crates.io 版がARM64でビルドできない件は `Cargo.toml` の `[patch.crates-io]`
# で解決済み。こちらは `cfg(windows)` のぶん（12件）だけテストが少ない。
# 両方を必須にしているのは、**片方だけ直して配布物の片方が壊れる**のを防ぐため
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチへ続けて push したら前の実行は捨てる（無駄に並べない）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 検査するだけなので読めれば足りる（リポジトリの既定が書き込みでも引き上げない）
permissions:
  contents: read

jobs:
  check:
    # **片方が落ちてももう片方は最後まで走らせる**。両方を同時に直したいので、
    # 「Windowsが赤いからmacOSの結果は分からない」を作らない。
    #
    # **マトリクスにすると報告名が変わる**（`check` →
    # `check (windows-latest)` / `check (macos-latest)`）。このリポジトリは
    # 2026-08-14時点でブランチ保護もルールセットも掛けていないので実害は無いが、
    # **あとで `main` に保護を掛けるときは新しい方の名前で必須にすること**
    # ——`check` を必須にすると、二度と報告されない名前を待ち続けてPRが固まる
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # rav1d（AVIF）と mozjpeg のアセンブリに要る。**外すと6倍遅くなる**ので
      # 「速いことが仕様」のこのアプリでは無効化を選べない。
      # **macOSでは要らない**——NASMはx86のアセンブラで、ARM64では
      # rav1d も libjpeg-turbo も `.S` を clang に通す（2026-08-14に実測）
      - name: NASM を入れる
        if: runner.os == 'Windows'
        # **`shell` を明示する。** Windowsランナーの既定は pwsh だが、
        # 書いていないと actionlint が bash と思って shellcheck を掛ける
        # （PowerShellの `$n` や `{}` が構文誤りとして並ぶ）。
        # 何より、既定に頼らないほうが読む側に優しい
        shell: pwsh
        run: |
          # **瞬断だけ拾う。障害は待たない。** 2026-08-31 に Chocolatey の
          # API（`/api/v2/`）が 503 を返し、サイト本体は 200 のまま、という
          # 部分障害でPRが2回止まった。**あの回はこの3回では救えない**
          # （20分以上続いた）——ここが見ているのは、数十秒で戻る類のほうである。
          #
          # **失敗は握り潰さない。** 3回とも駄目なら `exit 1` で step ごと落とす。
          # NASMを欠いたまま先へ進むと、後ろのビルドが**別の顔で**転ぶか、もっと
          # 悪くてアセンブリを落としたバイナリが黙って出来る（上の「6倍遅くなる」）。
          #
          # 下の1行は保険である。**既定は偽なので、今日は書かなくても動く**
          # （PowerShell 7.6 の about_Preference_Variables で確認）。それでも
          # 書くのは、**この繰り返しの正しさをそこに預けているから**——真に
          # なると、GitHubのpwshが設定する `$ErrorActionPreference = 'Stop'` と
          # 噛み合って**`choco` の非0終了がその場で例外になり**、1回目の失敗で
          # step が死ぬ。繰り返す前に終わってしまう。
          #
          # `throw` ではなく `exit 1` を使うのも同じ筋で、こちらはシェルの
          # 設定に依らず必ず落ちる。
          #
          # `choco install` は既に入っているとき 0 を返すので、途中まで入った
          # 状態から試し直しても壊れない
          $PSNativeCommandUseErrorActionPreference = $false
          $tries = 3
          $ok = $false
          foreach ($n in 1..$tries) {
            choco install nasm -y --no-progress --version=3.2.0
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            if ($n -lt $tries) {
              Write-Host "::warning::choco が exit $LASTEXITCODE で落ちました（$n/$tries）。60秒待って試し直します"
              Start-Sleep -Seconds 60
            }
          }
          if (-not $ok) {
            Write-Host "::error::NASM を入れられませんでした（$tries 回とも失敗）。Chocolatey 側の障害が続いているなら、復旧を確かめてから再実行してください"
            exit 1
          }
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - uses: actions/setup-node@v4
        with:
          # **22.18 以上**（2026-09-02、ゲート2の指摘）。辞書のテストは Node が
          # `.ts` をそのまま読めることに乗っていて、それが既定になったのが 22.18。
          # `22` のままだと 22.17 以下のイメージに当たった瞬間
          # `Unknown file extension ".ts"` で落ちる。範囲で書いて床を明示する
          node-version: "^22.18"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # **Rustの検査より先に置く**。`tauri::generate_context!` は展開のときに
      # `ui/dist` の実在を確かめるので、UIを先に作らないと clippy も test も
      # 「frontendDist が無い」で止まる（`tools/release.ps1` と同じ順序）。
      # `tsc -b` が型の壊れを拾う役目も兼ねる
      - name: UI のビルド
        run: |
          npm --prefix ui ci
          npm --prefix ui run build

      # 辞書の検査（桁区切り・単複・引数の落ち・訳し漏れ）。**依存は増えていない**
      # ——Node が `.ts` をそのまま読むので、テストランナも変換器も要らない。
      # 型が見ているのはキーの過不足だけで、中身は誰も見ていなかった
      - name: 辞書のテスト
        run: npm --prefix ui test

      - name: Rust の道具を揃える
        run: rustup component add clippy rustfmt

      # mozjpeg・rav1d・SQLite をソースからビルドするので、キャッシュが無いと
      # 毎回10分以上かかる
      - uses: Swatinem/rust-cache@v2

      - name: 書式
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: テスト
        run: cargo test --workspace
